name: Build E-Rate Account Intelligence Brief

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "collectors/build_erate_brief.py"
      - ".github/workflows/build-erate-brief.yml"
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build consolidated E-Rate brief
        run: python collectors/build_erate_brief.py

      - name: Commit consolidated brief
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/erate_account_intelligence.md
          git diff --cached --quiet || git commit -m "Update consolidated E-Rate intelligence brief"
          git pull --rebase
          git push
