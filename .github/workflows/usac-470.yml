name: USAC Form 470 Collector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/accounts.csv"
      - ".github/workflows/usac-470.yml"
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run USAC collector
        run: python collectors/usac_470.py

      - name: Commit updated USAC data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/usac_470_activity.json data/erate_brief.md
          git diff --cached --quiet || git commit -m "Update USAC Form 470 activity"
          git push
